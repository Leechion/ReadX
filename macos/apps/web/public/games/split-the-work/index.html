<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. Everything else is the game's own: replace
// what is marked "the game", and draw every figure in the brief's look, in 2D or with three.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size; a pixel look lowers it and sets PIXEL
const PIXEL = false;            // pixel looks: whole-number scale, no smoothing
const FONT = 'sans-serif';      // the brief's look picks the type
const TITLE = '双人分工解谜';
const CONTROLS = ['1P:WASD 走 · 撞到木箱就是在推', '2P:方向键 走(按一下接管青蓝)', 'R 重来本关 · P 暂停 · M 静音'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
const tp = { x: -1, y: -1, click: false };
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointermove', e => { const [x, y] = toLogical(e); tp.x = x; tp.y = y; });
addEventListener('pointerdown', e => { startAudio(); const [x, y] = toLogical(e); tp.x = x; tp.y = y; tp.click = true; });
addEventListener('blur', () => down.clear());
function drawButton(btn, label, fill, hoverFill, textCol, hover) {
  const dy = hover ? -2 : 0;
  ctx.save();
  ctx.shadowColor = hover ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = hover ? 18 : 10;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(btn.x, btn.y + dy, btn.w, btn.h, 14);
  else ctx.rect(btn.x, btn.y + dy, btn.w, btn.h);
  ctx.fillStyle = hover ? hoverFill : fill;
  ctx.fill();
  ctx.restore();
  text(label, btn.x + btn.w / 2, btn.y + dy + btn.h / 2, 22, textCol);
}
function inRect(x, y, r) {
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- The game: five stone rooms, one pusher and one crawler ------------------------------
// Legend: # wall · , vent (blue only) · P plate A · Q plate B · G gate A · H gate B
//         X crate (orange pushes) · 1 orange start · 2 blue start · a orange goal · b blue goal
const TILE = 48, COLS = 20, ROWS = 9;
const GX = 160, GY = 176; // the room's top-left corner on screen
const BODY = [{ c: '#e07a3a', d: '#8a3f18', n: '1P·暖橙' }, { c: '#3aa0c0', d: '#1d5f78', n: '2P·青蓝' }];

const LEVELS = [
  {
    name: '推箱开门',
    hint: '暖橙把木箱推上铜盘,闸门就一直开着——青蓝在门口等着就行',
    rows: [
      '####################',
      '#.........#........#',
      '#..1...X..#..a..b..#',
      '#.........#........#',
      '#....P....G........#',
      '#..2......#........#',
      '#.........#........#',
      '#.........#........#',
      '####################',
    ],
    bot: [[2, 3], [9, 3], [9, 4], [10, 4], [11, 4], [16, 4], [16, 2]],
  },
  {
    name: '你按我过',
    hint: '暖橙站上铜盘替青蓝按住左边的门;青蓝过去站上铜盘,再替暖橙按住右边的门',
    rows: [
      '####################',
      '#....b...#....a....#',
      '#......Q.#.........#',
      '######G#######H#####',
      '#..................#',
      '#..1............2..#',
      '#......P...........#',
      '#..................#',
      '####################',
    ],
    bot: [[6, 4], [6, 2], { hold: [7, 2] }, [5, 1]],
  },
  {
    name: '钻窄缝',
    hint: '窄缝只有青蓝钻得过——青蓝钻过去按住铜盘,暖橙才进得了左边的房间',
    rows: [
      '####################',
      '#...#.........#....#',
      '#.a.#.........#..Q.#',
      '#...#.........,....#',
      '#...H.........#....#',
      '#...#.........#....#',
      '#...#...1...2.#..b.#',
      '#...#.........#....#',
      '####################',
    ],
    bot: [[13, 6], [13, 3], [14, 3], [17, 3], { hold: [17, 2] }, [17, 6]],
  },
  {
    name: '箱子与铜盘',
    hint: '暖橙先把木箱推上铜盘,左边那扇门就永远开着;青蓝按住铜盘,右边那扇门才会升起',
    rows: [
      '####################',
      '#..b........a......#',
      '#..........#.......#',
      '####G#######H#######',
      '#..................#',
      '#..................#',
      '#....1.......X...2.#',
      '#......P....Q......#',
      '####################',
    ],
    bot: [{ hold: [12, 7] }, [4, 6], [3, 1]],
  },
  {
    name: '两扇门',
    hint: '暖橙推箱开左边的门,青蓝钻窄缝按住铜盘——两扇门,一人管一扇',
    rows: [
      '####################',
      '#..a....#.....Q..b.#',
      '#.......#..........#',
      '###H#########,######',
      '#..................#',
      '###########G########',
      '#...1..P..2.X......#',
      '#..................#',
      '####################',
    ],
    bot: [{ wait: [10, 7], gate: 'A' }, [11, 7], [11, 6], [11, 5], [11, 4], [13, 4], [13, 3], [14, 2], { hold: [14, 1] }, [17, 1]],
  },
];

// ---- State --------------------------------------------------------------------------------
let scene, state;
const startLevel = Math.max(0, Math.min(LEVELS.length - 1, Number(params.get('level')) || 0));

function parseLevel(def) {
  const grid = def.rows.map(row => row.split(''));
  const out = { grid, plates: [], gates: [], goals: {}, starts: [null, null], boxes: [] };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c];
    if (ch === 'P' || ch === 'Q') { out.plates.push({ c, r, g: ch === 'P' ? 'A' : 'B' }); grid[r][c] = '.'; }
    else if (ch === 'G' || ch === 'H') { out.gates.push({ c, r, g: ch === 'G' ? 'A' : 'B' }); }
    else if (ch === '1' || ch === '2') { out.starts[ch === '1' ? 0 : 1] = { c, r }; grid[r][c] = '.'; }
    else if (ch === 'a' || ch === 'b') { out.goals[ch] = { c, r }; }
    else if (ch === 'X') { out.boxes.push({ c, r }); grid[r][c] = '.'; }
  }
  for (const g of out.gates) { // a wall running east-west makes the gate a beam, else a grille post
    const left = grid[g.r][g.c - 1] === '#', right = grid[g.r][g.c + 1] === '#';
    g.h = left && right;
  }
  return out;
}
function mkP(i, s) {
  return { i, c: s.c, r: s.r, fc: s.c, fr: s.r, anim: 0, dur: 1, cool: 0, face: [0, 1] };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, li: 0, p2Human: false, steps: 0, totalSteps: 0, levelT: 0,
            parts: [], hintT: 0, cleared: false, clearT: 0, result: null, botT: 0, botWp: 0 };
  loadLevel(startLevel);
}
function loadLevel(i) {
  const L = LEVELS[i], info = parseLevel(L);
  state.li = i; state.grid = info.grid; state.plates = info.plates; state.gates = info.gates;
  state.goals = info.goals;
  state.boxes = info.boxes.map(b => ({ c: b.c, r: b.r, fc: b.c, fr: b.r, anim: 0, dur: 1 }));
  state.p = [mkP(0, info.starts[0]), mkP(1, info.starts[1])];
  state.open = { A: false, B: false };
  state.steps = 0; state.levelT = 0; state.cleared = false; state.clearT = 0;
  state.hintT = tune.hint_time; state.botT = 0; state.botWp = 0; state.parts = [];
  updateGates(true);
}
function inside(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
function boxAt(c, r) { return state.boxes.find(b => b.c === c && b.r === r); }
function playerAt(c, r) { return state.p.find(p => p.c === c && p.r === r); }
function gateAt(c, r) { return state.gates.find(g => g.c === c && g.r === r); }
function gateOpenAt(c, r) { const g = gateAt(c, r); return !g || state.open[g.g]; }
function ventOK(i, c, r) { return state.grid[r][c] !== ',' || i === 1; }
function wallAt(c, r) { return !inside(c, r) || state.grid[r][c] === '#'; }

function sparkle(x, y, col, n) {
  for (let k = 0; k < n; k++) {
    const a = rng() * Math.PI * 2, sp = 40 + rng() * 120;
    state.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + rng() * 0.5, max: 1, col, r: 2 + rng() * 2.5 });
  }
}
function updateGates(quiet) {
  for (const g of ['A', 'B']) {
    let pressed = false;
    for (const pl of state.plates) {
      if (pl.g !== g) continue;
      if (playerAt(pl.c, pl.r) || boxAt(pl.c, pl.r)) pressed = true;
    }
    if (pressed === state.open[g]) continue;
    state.open[g] = pressed;
    if (quiet) continue;
    events.push({ t: state.t, kind: pressed ? 'gate-open' : 'gate-close', gate: g });
    tone(pressed ? 392 : 196, 0.22, 'triangle', 0.18);
    for (const gt of state.gates) if (gt.g === g)
      sparkle(GX + gt.c * TILE + TILE / 2, GY + gt.r * TILE + TILE / 2, pressed ? '#ffd98a' : '#9aa4b2', 8);
  }
}

function tryStep(p, dc, dr) {
  if (p.anim > 0 || (!dc && !dr)) return false;
  const c = p.c + dc, r = p.r + dr;
  if (wallAt(c, r) || !ventOK(p.i, c, r) || !gateOpenAt(c, r)) return false;
  const box = boxAt(c, r);
  if (box) {
    if (p.i !== 0) return false; // 只有暖橙推得动
    const bc = c + dc, br = r + dr;
    if (wallAt(bc, br) || !ventOK(0, bc, br) || !gateOpenAt(bc, br) || boxAt(bc, br) || playerAt(bc, br)) return false;
    box.fc = box.c; box.fr = box.r; box.c = bc; box.r = br; box.anim = tune.step_time; box.dur = tune.step_time;
    tone(150, 0.08, 'square', 0.12);
  }
  p.fc = p.c; p.fr = p.r; p.c = c; p.r = r;
  p.face = [dc, dr]; p.anim = tune.step_time; p.dur = tune.step_time;
  state.steps++;
  updateGates();
  return true;
}

// ---- The partner: scripted waypoints; waits at closed gates, holds a plate until the
// ---- human is through the gate it opens ---------------------------------------------------
const KEYS = [
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
];
function dirFor(i) {
  const k = KEYS[i];
  let dc = 0, dr = 0, dh = false, dv = false;
  if (down.has(k.left)) { dc -= 1; dh = dh || hit.has(k.left); }
  if (down.has(k.right)) { dc += 1; dh = dh || hit.has(k.right); }
  if (down.has(k.up)) { dr -= 1; dv = dv || hit.has(k.up); }
  if (down.has(k.down)) { dr += 1; dv = dv || hit.has(k.down); }
  if (dc && dr) { // both axes: keep the one just pressed, else the vertical
    if (dv && !dh) { dc = 0; return [0, dr, dv]; }
    return [dc, 0, dh];
  }
  return [dc, dr, dc ? dh : dv];
}
// 一格一步:按一下走一格,按住才连走(慢一点),推箱不会滑出去
function movePlayer(p, dt) {
  p.cool = Math.max(0, p.cool - dt);
  if (p.anim > 0 || p.cool > 0) return;
  const [dc, dr, fresh] = dirFor(p.i);
  if (!dc && !dr) return;
  if (tryStep(p, dc, dr)) p.cool = fresh ? 0 : tune.hold_gap;
}
function botPath(c0, r0, c1, r1) {
  const key = (c, r) => r * COLS + c;
  const prev = new Map(); prev.set(key(c0, r0), null);
  const q = [[c0, r0]];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === c1 && r === r1) {
      const out = []; let k = key(c, r);
      while (k !== null) { out.push([k % COLS, Math.floor(k / COLS)]); k = prev.get(k); }
      return out.reverse();
    }
    for (const [dc, dr] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nc = c + dc, nr = r + dr;
      if (!inside(nc, nr) || state.grid[nr][nc] === '#' || boxAt(nc, nr)) continue;
      const k2 = key(nc, nr);
      if (prev.has(k2)) continue;
      prev.set(k2, key(c, r)); q.push([nc, nr]);
    }
  }
  return null;
}
function pathToGoal(list, ga) { // the orange player's route to its goal, gates as they stand
  const key = (c, r) => r * COLS + c;
  const from = state.p[0];
  const prev = new Map(); prev.set(key(from.c, from.r), null);
  const q = [[from.c, from.r]];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === ga.c && r === ga.r) {
      const out = []; let k = key(c, r);
      while (k !== null) { out.push(k); k = prev.get(k); }
      return out;
    }
    for (const [dc, dr] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nc = c + dc, nr = r + dr;
      if (boxAt(nc, nr)) continue;
      // orange's own passability: no walls, no vents, a gate only while it is open
      if (wallAt(nc, nr) || state.grid[nr][nc] === ',' || !gateOpenAt(nc, nr)) continue;
      const k2 = key(nc, nr);
      if (prev.has(k2)) continue;
      prev.set(k2, key(c, r)); q.push([nc, nr]);
    }
  }
  return null;
}
function canReleaseHold(tile) {
  const plate = state.plates.find(p => p.c === tile[0] && p.r === tile[1]);
  if (!plate) return true;
  const gates = state.gates.filter(g => g.g === plate.g);
  if (!gates.length) return true;
  const path = pathToGoal(null, state.goals.a);
  if (!path) return false;                        // the human still needs the door
  return !path.some(k => gates.some(g => g.r * COLS + g.c === k));
}
function botUpdate(dt) {
  state.botT += dt;
  if (state.botT < tune.bot_step) return;
  state.botT = 0;
  const bot = state.p[1], L = LEVELS[state.li];
  if (state.botWp >= L.bot.length) return;
  const wp = L.bot[state.botWp];
  const target = wp.hold || wp.wait || wp;
  if (bot.c === target[0] && bot.r === target[1]) {
    if (wp.hold) { if (canReleaseHold(wp.hold)) state.botWp++; return; }
    if (wp.wait) { if (state.open[wp.gate]) state.botWp++; return; }
    state.botWp++; return;
  }
  const path = botPath(bot.c, bot.r, target[0], target[1]);
  if (!path || path.length < 2) return;
  const [nc, nr] = path[1];
  if (wallAt(nc, nr) || !gateOpenAt(nc, nr) || boxAt(nc, nr)) return; // 站在关着的门前等
  tryStep(bot, nc - bot.c, nr - bot.r);
}

// ---- Play ----------------------------------------------------------------------------------
function onGoal(i) {
  const g = i === 0 ? state.goals.a : state.goals.b, p = state.p[i];
  return p.c === g.c && p.r === g.r;
}
function clearLevel() {
  state.cleared = true; state.clearT = tune.clear_wait;
  state.totalSteps += state.steps;
  events.push({ t: state.t, kind: 'level-clear', level: state.li });
  [440, 554, 659, 880].forEach((f, k) => setTimeout(() => tone(f, 0.18, 'triangle', 0.2), k * 90));
  for (const g of [state.goals.a, state.goals.b])
    sparkle(GX + g.c * TILE + TILE / 2, GY + g.r * TILE + TILE / 2, '#ffd98a', 18);
}
function finishGame() {
  let best = null;
  try { best = Number(localStorage.getItem('split_best')) || null; } catch (e) {}
  const total = state.t, newBest = !best || total < best;
  if (newBest) { try { localStorage.setItem('split_best', String(Math.round(total * 10) / 10)); } catch (e) {} }
  state.result = { total, steps: state.totalSteps, best: newBest ? total : best, newBest };
  events.push({ t: state.t, kind: 'game-clear', total: Math.round(total * 10) / 10 });
  scene = 'results';
}
function nextLevel() {
  if (state.li + 1 < LEVELS.length) loadLevel(state.li + 1);
  else finishGame();
}
function restartLevel() {
  const wasHuman = state.p2Human;
  state.p2Human = wasHuman;
  loadLevel(state.li);
  events.push({ t: state.t, kind: 'level-restart', level: state.li });
  tone(220, 0.14, 'square', 0.15);
}
function updateParts(dt) {
  for (const q of state.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 260 * dt; q.life -= dt; }
  state.parts = state.parts.filter(q => q.life > 0);
}
function updatePlay(dt) {
  state.t += dt;
  if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
  if (pressed('KeyR')) { restartLevel(); return; }
  updateParts(dt);
  for (const p of state.p) p.anim = Math.max(0, p.anim - dt);
  for (const b of state.boxes) b.anim = Math.max(0, b.anim - dt);
  if (state.cleared) { state.clearT -= dt; if (state.clearT <= 0) nextLevel(); return; }
  state.levelT += dt;
  state.hintT = Math.max(0, state.hintT - dt);
  if (!state.p2Human && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].some(c => pressed(c))) {
    state.p2Human = true;
    events.push({ t: state.t, kind: 'p2-takeover' });
  }
  movePlayer(state.p[0], dt);
  if (state.p2Human) movePlayer(state.p[1], dt);
  else botUpdate(dt);
  updateGates();
  if (!state.cleared && onGoal(0) && onGoal(1)) clearLevel();
}

// ---- Drawing: stone room, copper plates, iron gates, two little people ---------------------
function hash2(i, j) {
  let h = (i * 374761393 + j * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1a20'); g.addColorStop(0.6, '#15151a'); g.addColorStop(1, '#0e0e12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 地窑里的一盏灯:房间上方一团暖光
  const l = ctx.createRadialGradient(W / 2, 160, 40, W / 2, 380, 620);
  l.addColorStop(0, 'rgba(255,196,120,0.10)'); l.addColorStop(1, 'rgba(255,196,120,0)');
  ctx.fillStyle = l; ctx.fillRect(0, 0, W, H);
}
function drawWall(x, y, s) {
  ctx.fillStyle = '#584c40'; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = '#6d5e4c'; ctx.fillRect(x + 2, y + 2, s - 4, 6);
  ctx.strokeStyle = '#332b24'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
  ctx.strokeStyle = 'rgba(36,29,22,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 2, y + s * 0.48); ctx.lineTo(x + s - 2, y + s * 0.48);
  ctx.moveTo(x + s * 0.52, y + 8); ctx.lineTo(x + s * 0.52, y + s * 0.48);
  ctx.moveTo(x + s * 0.3, y + s * 0.48); ctx.lineTo(x + s * 0.3, y + s - 2);
  ctx.moveTo(x + s * 0.74, y + s * 0.48); ctx.lineTo(x + s * 0.74, y + s - 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x + 2, y + s - 7, s - 4, 5);
}
function drawFloor(x, y, s, c, r) {
  const h = hash2(c, r), l = 24 + h * 7;
  ctx.fillStyle = `hsl(214 9% ${l}%)`; ctx.fillRect(x, y, s, s);
  ctx.strokeStyle = 'rgba(16,18,22,0.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1);
  if (h > 0.68) {
    ctx.strokeStyle = 'rgba(14,16,20,0.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + s * 0.18, y + s * (0.26 + h * 0.3));
    ctx.lineTo(x + s * 0.42, y + s * (0.5 + h * 0.16));
    ctx.lineTo(x + s * 0.64, y + s * 0.46);
    ctx.stroke();
  }
  if (h < 0.18) { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x + 4, y + 4, s * 0.34, s * 0.22); }
}
function drawPlate(x, y, s, on, t) {
  const cx = x + s / 2, cy = y + s / 2;
  if (on) {
    ctx.globalAlpha = 0.16 + 0.1 * Math.sin(t * 5);
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.47, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = on ? '#f2bb6a' : '#9a6a3c';
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.3, 0, 6.283); ctx.fill();
  ctx.strokeStyle = on ? '#ffe6ad' : '#b8874f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(52,30,12,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.185, 0, 6.283); ctx.stroke();
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + Math.PI / 4;
    ctx.fillStyle = 'rgba(46,26,10,0.6)';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * s * 0.245, cy + Math.sin(a) * s * 0.245, 2.1, 0, 6.283); ctx.fill();
  }
  if (on) { ctx.fillStyle = 'rgba(255,246,214,0.75)'; ctx.beginPath(); ctx.arc(cx - s * 0.09, cy - s * 0.1, s * 0.05, 0, 6.283); ctx.fill(); }
}
function drawGate(x, y, s, open, h, t) {
  ctx.fillStyle = '#585d66'; // posts at both ends of the doorway
  if (h) { ctx.fillRect(x, y + 3, 7, s - 6); ctx.fillRect(x + s - 7, y + 3, 7, s - 6); }
  else { ctx.fillRect(x + 3, y, s - 6, 7); ctx.fillRect(x + 3, y + s - 7, s - 6, 7); }
  if (!open) {
    ctx.fillStyle = 'rgba(20,22,28,0.9)';
    if (h) ctx.fillRect(x + 7, y + 4, s - 14, s - 8); else ctx.fillRect(x + 4, y + 7, s - 8, s - 14);
    ctx.strokeStyle = '#98a0ab'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 1; k <= 3; k++) {
      if (h) { const yy = y + 4 + (s - 8) * k / 4; ctx.moveTo(x + 8, yy); ctx.lineTo(x + s - 8, yy); }
      else { const xx = x + 4 + (s - 8) * k / 4; ctx.moveTo(xx, y + 8); ctx.lineTo(xx, y + s - 8); }
    }
    if (h) { ctx.moveTo(x + s / 2, y + 5); ctx.lineTo(x + s / 2, y + s - 5); }
    else { ctx.moveTo(x + 5, y + s / 2); ctx.lineTo(x + s - 5, y + s / 2); }
    ctx.stroke();
    ctx.fillStyle = '#c6ccd4';
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 3, 0, 6.283); ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,217,138,0.5)'; ctx.lineWidth = 2;
    if (h) { ctx.beginPath(); ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + 10, y + s - 10); ctx.moveTo(x + s - 10, y + 10); ctx.lineTo(x + s - 10, y + s - 10); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + s - 10, y + 10); ctx.moveTo(x + 10, y + s - 10); ctx.lineTo(x + s - 10, y + s - 10); ctx.stroke(); }
  }
}
function drawVent(x, y, s, h) {
  drawWall(x, y, s);
  ctx.fillStyle = '#10131a';
  if (h) roundRect(x + 3, y + s * 0.38, s - 6, s * 0.24, 6);
  else roundRect(x + s * 0.38, y + 3, s * 0.24, s - 6, 6);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,190,230,0.55)';
  for (let k = 1; k <= 3; k++) {
    const fx = h ? x + 3 + (s - 6) * k / 4 : x + s / 2;
    const fy = h ? y + s / 2 : y + 3 + (s - 6) * k / 4;
    ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, 6.283); ctx.fill();
  }
}
function drawGoal(x, y, s, who, active, t) {
  const cx = x + s / 2, cy = y + s / 2, col = who === 0 ? '#e07a3a' : '#3aa0c0';
  ctx.strokeStyle = col; ctx.globalAlpha = active ? 0.95 : 0.5; ctx.lineWidth = 3;
  if (who === 0) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx + 11, cy + 8); ctx.lineTo(cx - 11, cy + 8);
    ctx.closePath(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx + 11, cy); ctx.lineTo(cx, cy + 12); ctx.lineTo(cx - 11, cy);
    ctx.closePath(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (active) {
    ctx.globalAlpha = 0.16 + 0.08 * Math.sin(t * 6);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, s * 0.44, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawBox(x, y, s, t) {
  const p = s * 0.09, w = s - p * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x + s / 2, y + s - p + 2, w * 0.44, 4.5, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#96683a'; ctx.fillRect(x + p, y + p, w, w);
  ctx.strokeStyle = '#5a3a1b'; ctx.lineWidth = 2.5; ctx.strokeRect(x + p, y + p, w, w);
  ctx.strokeStyle = '#b07f47'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x + p + 4, y + p + 4); ctx.lineTo(x + p + w - 4, y + p + w - 4);
  ctx.moveTo(x + p + w - 4, y + p + 4); ctx.lineTo(x + p + 4, y + p + w - 4);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(60,38,16,0.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(x + p + 7, y + p + 7, w - 14, w - 14);
  ctx.fillStyle = '#6d4a24';
  for (const [qx, qy] of [[p + 6, p + 6], [p + w - 6, p + 6], [p + 6, p + w - 6], [p + w - 6, p + w - 6]]) {
    ctx.beginPath(); ctx.arc(x + qx, y + qy, 1.8, 0, 6.283); ctx.fill();
  }
}
function playerPos(p) {
  const k = p.anim > 0 ? 1 - p.anim / p.dur : 1;
  const c = p.anim > 0 ? p.fc + (p.c - p.fc) * k : p.c;
  const r = p.anim > 0 ? p.fr + (p.r - p.fr) * k : p.r;
  return { x: GX + c * TILE + TILE / 2, y: GY + r * TILE + TILE / 2, moving: p.anim > 0 };
}
function drawPlayer(x, y, i, t, tag, walking) {
  const b = BODY[i];
  const bob = walking ? Math.sin(t * 18) * 1.6 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 15, 13, 5, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = b.d; // feet
  ctx.beginPath(); ctx.ellipse(x - 6, y + 13, 5, 3.4, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 6, y + 13, 5, 3.4, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = b.c; ctx.strokeStyle = b.d; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y + bob * 0.5, 13.5, 14.5, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.26)'; // bib
  ctx.beginPath(); ctx.ellipse(x, y + 5, 7.5, 5.5, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#20140c'; // eyes
  ctx.beginPath(); ctx.arc(x - 4.4, y - 3, 1.9, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4.4, y - 3, 1.9, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(x - 3.8, y - 3.7, 0.8, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5, y - 3.7, 0.8, 0, 6.283); ctx.fill();
  // 头顶记号:暖橙三角、青蓝菱形
  const my = y - 25 + bob;
  ctx.fillStyle = i === 0 ? '#ffc178' : '#7fd4ee';
  ctx.strokeStyle = b.d; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (i === 0) { ctx.moveTo(x, my - 6); ctx.lineTo(x + 5.5, my + 4); ctx.lineTo(x - 5.5, my + 4); }
  else { ctx.moveTo(x, my - 6); ctx.lineTo(x + 5.5, my); ctx.lineTo(x, my + 6); ctx.lineTo(x - 5.5, my); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if (tag) text(tag, x, y - 41 + bob, 13, i === 0 ? '#ffc178' : '#7fd4ee');
}
function drawWorld() {
  drawBackdrop();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = GX + c * TILE, y = GY + r * TILE, ch = state.grid[r][c];
    if (ch === '#') { drawWall(x, y, TILE); continue; }
    drawFloor(x, y, TILE, c, r);
    if (ch === ',') {
      const leftW = state.grid[r][c - 1] === '#', rightW = state.grid[r][c + 1] === '#';
      drawVent(x, y, TILE, leftW && rightW);
      continue;
    }
    if (ch === 'G' || ch === 'H') {
      const g = gateAt(c, r);
      drawGate(x, y, TILE, state.open[g.g], g.h, state.t);
      continue;
    }
    const pl = state.plates.find(p => p.c === c && p.r === r);
    if (pl) { drawPlate(x, y, TILE, state.open[pl.g], state.t); continue; }
    if (state.goals.a.c === c && state.goals.a.r === r) { drawGoal(x, y, TILE, 0, onGoal(0), state.t); continue; }
    if (state.goals.b.c === c && state.goals.b.r === r) { drawGoal(x, y, TILE, 1, onGoal(1), state.t); continue; }
  }
  // 墙外的一圈阴影
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 6;
  ctx.strokeRect(GX - 3, GY - 3, COLS * TILE + 6, ROWS * TILE + 6);
  for (const b of state.boxes) {
    const k = b.anim > 0 ? 1 - b.anim / b.dur : 1;
    const c = b.anim > 0 ? b.fc + (b.c - b.fc) * k : b.c;
    const r = b.anim > 0 ? b.fr + (b.r - b.fr) * k : b.r;
    drawBox(GX + c * TILE, GY + r * TILE, TILE, state.t);
  }
  for (const p of state.p) {
    const q = playerPos(p);
    const tag = p.i === 0 ? '1P' : (state.p2Human ? '2P' : '机');
    drawPlayer(q.x, q.y, p.i, state.t, tag, q.moving);
  }
  for (const q of state.parts) {
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (state.cleared && scene === 'play') { // 过关的一圈字(结算场景不再叠一层)
    ctx.fillStyle = 'rgba(12,12,16,0.55)'; ctx.fillRect(GX, GY + ROWS * TILE / 2 - 40, COLS * TILE, 80);
    text('这间通了!', GX + COLS * TILE / 2, GY + ROWS * TILE / 2, 42, '#ffd98a');
  }
}
function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10);
  return `${m}:${String(s).padStart(2, '0')}.${d}`;
}
function drawHUD() {
  text(TITLE, W / 2, 38, 30, '#f3e3c8');
  // 五间房的小格子
  const dw = 26, gap = 8, total = LEVELS.length * dw + (LEVELS.length - 1) * gap;
  for (let k = 0; k < LEVELS.length; k++) {
    const x = W / 2 - total / 2 + k * (dw + gap);
    ctx.fillStyle = k < state.li ? '#ffd98a' : (k === state.li ? '#c9a15e' : 'rgba(255,255,255,0.14)');
    roundRect(x, 62, dw, 9, 4); ctx.fill();
    if (k === state.li) { ctx.strokeStyle = '#ffd98a'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  text(`第 ${state.li + 1} 间 · ${LEVELS[state.li].name}`, GX, 108, 22, '#e8d6b8', 'left');
  text(`时间 ${fmt(state.t)}  ·  步数 ${state.totalSteps + state.steps}`, GX + COLS * TILE, 108, 20, '#a9b6c6', 'right');
  // 提示
  const hint = LEVELS[state.li].hint;
  ctx.font = `19px ${FONT}`;
  const hw = ctx.measureText(hint).width + 36;
  ctx.fillStyle = 'rgba(20,22,28,0.78)';
  roundRect(W / 2 - hw / 2, 626, hw, 34, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,217,138,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
  text(hint, W / 2, 643, 19, '#dcc9a6');
  text(CONTROLS.join('   ·   '), W / 2, 680, 14, 'rgba(200,208,218,0.45)');
}

// ---- Scenes ---------------------------------------------------------------------------
function drawTitle() {

  ctx.fillStyle = 'rgba(10,10,14,0.62)'; ctx.fillRect(0, 0, W, H);
  text(TITLE, W / 2, 210, 66, '#f3e3c8');

  BODY.forEach((b, i) => {
    ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(W / 2 - 150 + i * 300, 372, 18, 0, 6.283); ctx.fill();
    ctx.strokeStyle = b.d; ctx.lineWidth = 2.5; ctx.stroke();
    text(b.n, W / 2 - 150 + i * 300, 412, 20, b.c);
  });
  text('一人一组按键,两个人挨着坐', W / 2, 448, 18, '#9aa4b2');

  const btn = { x: W / 2 - 160, y: 608, w: 320, h: 58 };
  drawButton(btn, '开始闯关  [Enter]', '#ffd98a', '#ffe6ad', '#1a1510', inRect(tp.x, tp.y, btn));

// figures: 每一种图形并排放一行,让描边检查看得见
function drawUnit(kind, cx, cy, s, t) {
  const x = cx - s / 2, y = cy - s / 2;
  if (kind === 'wall') drawWall(x, y, s);
  else if (kind === 'floor') drawFloor(x, y, s, 3, 5);
  else if (kind === 'plate') { drawFloor(x, y, s, 3, 5); drawPlate(x, y, s, false, t); }
  else if (kind === 'plateOn') { drawFloor(x, y, s, 3, 5); drawPlate(x, y, s, true, t); }
  else if (kind === 'gate') { drawFloor(x, y, s, 3, 5); drawGate(x, y, s, false, true, t); }
  else if (kind === 'gateOn') { drawFloor(x, y, s, 3, 5); drawGate(x, y, s, true, true, t); }
  else if (kind === 'vent') drawVent(x, y, s, false);
  else if (kind === 'box') { drawFloor(x, y, s, 3, 5); drawBox(x, y, s, t); }
  else if (kind === 'goalA') { drawFloor(x, y, s, 3, 5); drawGoal(x, y, s, 0, false, t); }
  else if (kind === 'goalB') { drawFloor(x, y, s, 3, 5); drawGoal(x, y, s, 1, false, t); }
  else if (kind === 'p0') { drawFloor(x, y, s, 3, 5); drawPlayer(cx, cy + 2, 0, t, '', false); }
  else if (kind === 'p1') { drawFloor(x, y, s, 3, 5); drawPlayer(cx, cy + 2, 1, t, '', false); }
}
function drawFigures() {
  drawBackdrop();
  ctx.fillStyle = 'rgba(16,18,24,0.9)';
  roundRect(70, 96, 1140, 560, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,217,138,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  text('关着的铁栅挡住两人;铜盘被踩住(或压上木箱)铁栅才升起;窄缝只有青蓝钻得过;木箱只有暖橙推得动',
       W / 2, 132, 19, '#b9c6d6');
  const row1 = [
    ['wall', '石墙'], ['floor', '石板地'], ['plate', '铜盘·空着'], ['plateOn', '铜盘·被踩住'],
    ['gate', '闸门·关'], ['gateOn', '闸门·开'],
  ];
  const row2 = [
    ['vent', '窄缝·只青蓝钻'], ['box', '木箱·只暖橙推'], ['goalA', '目标格·暖橙'],
    ['goalB', '目标格·青蓝'], ['p0', '1P·暖橙'], ['p1', '2P·青蓝'],
  ];
  const cols = [150, 346, 542, 738, 934, 1130];
  row1.forEach(([k, label], i) => { drawUnit(k, cols[i], 258, 66, state.t); text(label, cols[i], 316, 17, '#cfd8e4'); });
  row2.forEach(([k, label], i) => { drawUnit(k, cols[i], 452, 66, state.t); text(label, cols[i], 510, 17, '#cfd8e4'); });
  text('两人各站在自己的目标格上,这间房就通了', W / 2, 600, 18, '#9fb0c2');
}

let sceneDefs = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { drawFigures(); },
  },
  title: {
    update() {
      const btn = { x: W / 2 - 160, y: 608, w: 320, h: 58 };
      const hover = inRect(tp.x, tp.y, btn);
      canvas.style.cursor = hover ? 'pointer' : 'default';
      if (pressed('Enter') || pressed('Space') || (tp.click && hover)) {
        tp.click = false; canvas.style.cursor = 'default'; reset(); scene = 'play'; return;
      }
      tp.click = false;
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) { updatePlay(dt); },
    draw() { drawWorld(); drawHUD(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() {
      drawWorld(); drawHUD();
      ctx.fillStyle = 'rgba(8,8,12,0.6)'; ctx.fillRect(0, 0, W, H);
      text('暂停', W / 2, H / 2 - 16, 52, '#f3e3c8');
      text('按 P 继续 · R 重来本间', W / 2, H / 2 + 44, 22, '#c9b8a0');
    },
  },
  results: {
    update() {
      const btn = { x: W / 2 - 180, y: 440, w: 360, h: 58 };
      const hover = inRect(tp.x, tp.y, btn);
      canvas.style.cursor = hover ? 'pointer' : 'default';
      if (pressed('Enter') || pressed('KeyR') || pressed('Space') || (tp.click && hover)) {
        tp.click = false; canvas.style.cursor = 'default'; reset(); scene = 'play'; return;
      }
      tp.click = false;
    },
    draw() {
      drawWorld();
      ctx.fillStyle = 'rgba(10,10,14,0.72)'; ctx.fillRect(0, 0, W, H);
      const r = state.result || { total: state.t, steps: state.totalSteps, best: null };
      text('五间房,全通了', W / 2, 200, 56, '#ffd98a');
      text(`用时 ${fmt(r.total)}  ·  一共 ${r.steps} 步`, W / 2, 286, 30, '#f3e3c8');
      if (r.newBest) text('新的最快通关!', W / 2, 344, 26, '#7fd4ee');
      else if (r.best) text(`最快 ${fmt(r.best)}`, W / 2, 344, 24, '#a9b6c6');
      const btn = { x: W / 2 - 180, y: 440, w: 360, h: 58 };
      drawButton(btn, '再从第一间来一次  [Enter]', '#ffd98a', '#ffe6ad', '#1a1510', inRect(tp.x, tp.y, btn));
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  sceneDefs[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { sceneDefs[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
