name: Build macOS artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'macos-v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: macos/apps/server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: node scripts/sync-platforms.mjs --check
      - name: Install and verify runtime
        working-directory: macos
        run: npm ci && npm run setup:runtime && npm run check:runtime
      - name: Test and package local unsigned artifacts
        working-directory: macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm test && npm run build:release && npm run test:desktop && npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ReadX-macOS
          path: |
            macos/release/*.dmg
            macos/release/*.zip
            macos/release/*.blockmap
            macos/release/latest-mac.yml
          retention-days: 7

      - name: Upload DMG to the existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#macos-}"
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          shopt -s nullglob
          release_files=(macos/release/*.dmg macos/release/*.zip macos/release/*.blockmap macos/release/latest-mac.yml)
          if ((${#release_files[@]} < 4)); then
            echo "Expected DMG, ZIP, blockmaps, and latest-mac.yml; found ${#release_files[@]} files"
            exit 1
          fi
          gh release upload "$release_tag" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --clobber